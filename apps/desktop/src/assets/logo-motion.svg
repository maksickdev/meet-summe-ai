<svg width="500" height="500" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A83F2" />
      <stop offset="50%" style="stop-color:#74B9FF">
        <animate attributeName="offset" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#4A83F2" />
    </linearGradient>

    <style>
      /* Body sway */
      @keyframes sitSway {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg); }
      }
      
      /* Shadow stretch */
      @keyframes shadowStretch {
        0%, 100% { transform: scaleX(1.1) translateX(-5px); opacity: 0.2; }
        50% { transform: scaleX(1.1) translateX(5px); opacity: 0.2; }
      }

      /* Antenna movement */
      @keyframes antennaLag {
        0%, 100% { transform: rotate(12deg); }
        50% { transform: rotate(-12deg); }
      }

      /* Eye follow */
      @keyframes eyeFollow {
        0%, 100% { transform: translate(-4px, 1px); }
        50% { transform: translate(4px, 1px); }
      }

      @keyframes blink {
        0%, 93%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }

      .robot-base { 
        animation: sitSway 4s ease-in-out infinite; 
        transform-origin: 256px 450px;
      }
      .ground-shadow { 
        animation: shadowStretch 4s ease-in-out infinite; 
        transform-origin: 256px 460px; 
      }
      .antenna { 
        animation: antennaLag 4s ease-in-out infinite; 
        transform-origin: 256px 140px; 
      }
      .eye-white-part { 
        animation: blink 5s infinite; 
        transform-origin: 256px 256px; 
      }
      .pupil-group {
        animation: eyeFollow 4s ease-in-out infinite;
      }
      .glow-layer { filter: url(#glow); opacity: 0.7; }
    </style>
  </defs>

  <!-- Ground shadow -->
  <ellipse class="ground-shadow" cx="256" cy="465" rx="110" ry="12" fill="#1E3766" />

  <g class="robot-base">
    <!-- Glow layer -->
    <path class="glow-layer" d="M256 120 C160 120 80 280 80 380 C80 440 160 460 256 460 C352 460 432 440 432 380 C432 280 352 120 256 120Z" fill="#4A83F2" />

    <!-- Antenna -->
    <g class="antenna">
      <path d="M256 140 Q260 90 270 50" stroke="#1E3A6D" stroke-width="14" fill="none" stroke-linecap="round" />
      <circle cx="270" cy="50" r="18" fill="#1E3A6D" />
      <circle cx="270" cy="50" r="6" fill="#74B9FF">
        <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Main body -->
    <path d="M256 120 C160 120 80 280 80 380 C80 440 160 460 256 460 C352 460 432 440 432 380 C432 280 352 120 256 120Z" fill="#1E3766" />

    <!-- Bottom wave -->
    <path d="M85 380 Q150 345 250 395 T428 385 C425 435 350 455 256 455 C160 455 85 435 85 380Z" fill="url(#waveGrad)" />

    <!-- Eye -->
    <circle cx="256" cy="256" r="85" fill="#3D9BFF" />
    
    <g class="eye-white-part">
      <circle cx="256" cy="256" r="55" fill="white" />
      <g class="pupil-group">
        <!-- Pupil -->
        <circle cx="256" cy="256" r="28" fill="#1E3766" />
        <circle cx="268" cy="244" r="8" fill="white" />
      </g>
    </g>
  </g>
</svg>